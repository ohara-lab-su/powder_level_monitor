[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powder-level-monitor"
version = "0.1.0"
description = "Camera-based powder surface level monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "PySide6",
    "grpc-frame",
    "xlogger-py",
]

[tool.setuptools.packages.find]
where = ["src"]
